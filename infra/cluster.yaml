apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ebpf-mastery-lab
  region: us-east-2
  version: "1.31"

managedNodeGroups:
  - name: mastery-nodes
    instanceType: t3.medium
    minSize: 1
    maxSize: 2
    desiredSize: 1
    volumeSize: 20
    ssh:
      allow: true
    labels:
      role: observability-lab
